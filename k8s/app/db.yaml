apiVersion: v1
kind: Service
metadata:
  name: db
  namespace: taskflow
  labels:
    app: taskflow
    component: db
spec:
  type: ClusterIP
  selector:
    app: taskflow
    component: db
  ports:
    - name: postgres
      port: 5432
      targetPort: postgres
      protocol: TCP
---
apiVersion: v1
kind: Service
metadata:
  name: db-headless
  namespace: taskflow
  labels:
    app: taskflow
    component: db
spec:
  clusterIP: None
  selector:
    app: taskflow
    component: db
  ports:
    - name: postgres
      port: 5432
      targetPort: postgres
      protocol: TCP
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: db
  namespace: taskflow
  labels:
    app: taskflow
    component: db
spec:
  serviceName: db-headless
  replicas: 1
  selector:
    matchLabels:
      app: taskflow
      component: db
  template:
    metadata:
      labels:
        app: taskflow
        component: db
    spec:
      containers:
        - name: postgres
          image: postgres:17-alpine
          imagePullPolicy: IfNotPresent
          ports:
            - name: postgres
              containerPort: 5432
              protocol: TCP
          envFrom:
            - configMapRef:
                name: db-config
          env:
            - name: POSTGRES_PASSWORD_FILE
              value: /run/secrets/db-credentials/password
          startupProbe:
            exec:
              command:
                - /bin/sh
                - -c
                - pg_isready -U "$POSTGRES_USER" -d "$POSTGRES_DB"
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 30
          readinessProbe:
            exec:
              command:
                - /bin/sh
                - -c
                - pg_isready -U "$POSTGRES_USER" -d "$POSTGRES_DB"
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            exec:
              command:
                - /bin/sh
                - -c
                - pg_isready -U "$POSTGRES_USER" -d "$POSTGRES_DB"
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 300m
              memory: 384Mi
          volumeMounts:
            - name: postgres-data
              mountPath: /var/lib/postgresql/data
            - name: db-credentials
              mountPath: /run/secrets/db-credentials
              readOnly: true
      volumes:
        - name: db-credentials
          secret:
            secretName: db-credentials
            items:
              - key: password
                path: password
  volumeClaimTemplates:
    - metadata:
        name: postgres-data
        labels:
          app: taskflow
          component: db
      spec:
        accessModes:
          - ReadWriteOnce
        storageClassName: local-path
        resources:
          requests:
            storage: 2Gi