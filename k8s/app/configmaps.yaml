apiVersion: v1
kind: ConfigMap
metadata:
  name: api-config
  namespace: taskflow
  labels:
    app: taskflow
    component: api
data:
  APP_ENV: production
  HOST: 0.0.0.0
  PORT: "3000"
  DB_HOST: db
  DB_PORT: "5432"
  DB_NAME: taskflow
  DB_USER: taskflow
  DB_CONNECT_RETRIES: "5"
  DB_CONNECT_INTERVAL_MS: "2000"
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: db-config
  namespace: taskflow
  labels:
    app: taskflow
    component: db
data:
  POSTGRES_DB: taskflow
  POSTGRES_USER: taskflow