apiVersion: apps/v1
kind: Deployment
metadata:
  name: taskflow-api
  namespace: taskflow
  labels:
    app: taskflow
    component: api
spec:
  replicas: 2
  selector:
    matchLabels:
      app: taskflow
      component: api
  template:
    metadata:
      labels:
        app: taskflow
        component: api
    spec:
      containers:
        - name: api
          image: bernardkabou11/taskflow-api:1.0.0
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 3000
              protocol: TCP
          envFrom:
            - configMapRef:
                name: api-config
          env:
            - name: DB_PASSWORD_FILE
              value: /run/secrets/db-credentials/password
          startupProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 30
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 400m
              memory: 384Mi
          volumeMounts:
            - name: db-credentials
              mountPath: /run/secrets/db-credentials
              readOnly: true
      volumes:
        - name: db-credentials
          secret:
            secretName: db-credentials
            items:
              - key: password
                path: password
---
apiVersion: v1
kind: Service
metadata:
  name: taskflow-api
  namespace: taskflow
  labels:
    app: taskflow
    component: api
spec:
  type: ClusterIP
  selector:
    app: taskflow
    component: api
  ports:
    - name: http
      port: 3000
      targetPort: http
      protocol: TCP
---
apiVersion: v1
kind: Service
metadata:
  name: api
  namespace: taskflow
  labels:
    app: taskflow
    component: api
spec:
  type: ClusterIP
  selector:
    app: taskflow
    component: api
  ports:
    - name: http
      port: 3000
      targetPort: http
      protocol: TCP