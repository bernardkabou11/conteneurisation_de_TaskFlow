apiVersion: apps/v1
kind: Deployment
metadata:
  name: taskflow-front
  namespace: taskflow
  labels:
    app: taskflow
    component: front
spec:
  replicas: 2
  selector:
    matchLabels:
      app: taskflow
      component: front
  template:
    metadata:
      labels:
        app: taskflow
        component: front
    spec:
      containers:
        - name: front
          image: bernardkabou11/taskflow-front:1.0.0
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 80
              protocol: TCP
          startupProbe:
            httpGet:
              path: /
              port: http
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 30
          readinessProbe:
            httpGet:
              path: /
              port: http
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /
              port: http
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 100m
              memory: 128Mi
---
apiVersion: v1
kind: Service
metadata:
  name: front
  namespace: taskflow
  labels:
    app: taskflow
    component: front
spec:
  type: LoadBalancer
  selector:
    app: taskflow
    component: front
  ports:
    - name: http
      port: 8080
      targetPort: http
      protocol: TCP